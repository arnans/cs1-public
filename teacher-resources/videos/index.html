        <div class="ch-num">${ch.num}</div>
        <h2>${ch.title[lang]}</h2>
      </div>
      <p class="ch-meta">${ch.clips.length} ${t.clips}</p>
      <div class="grid">`;
    for (const c of ch.clips) {
      // url is per-language; fall back to the other language's video if only one exists
      const href = c.url ? (c.url[lang] || c.url.th || c.url.en) : null;
      const watchLabel = c.url && c.url[lang] ? t.watch : t.watchOther;
      const thumbInner = `
            <img src="thumbs/${c.thumb}.jpg" alt="" loading="lazy">
            <div class="play"><span>${ICON_PLAY}</span></div>`;
      const thumb = href
        ? `<a class="thumb" href="${href}" target="_blank" rel="noopener">${thumbInner}</a>`
        : `<div class="thumb">${thumbInner}</div>`;
      const action = href
        ? `<a class="btn" href="${href}" target="_blank" rel="noopener">${ICON_PLAY}${watchLabel}</a>`
        : `<span class="soon">${ICON_CLOCK}${t.soon}</span>`;
      html += `
        <div class="card">
          ${thumb}
          <div class="body">
            <div class="chips">
              <span class="chip-id">${c.id}</span>
              <span class="chip-kind ${c.kind}">${t[c.kind]}</span>
            </div>
            <div class="title">${c.title[lang]}</div>
            <div class="desc">${c.desc[lang]}</div>
            <div class="use">${c.use[lang]}</div>
            ${action}
          </div>
        </div>`;
    }
    html += `
      </div>
    </section>`;
  }
  html += `<footer>${t.footer}</footer>`;
  document.getElementById("content").innerHTML = html;
}

function setLang(lang) {
  try { localStorage.setItem("tr-lang", lang); } catch (e) {}
  render(lang);
}

let lang = "th";
try { lang = localStorage.getItem("tr-lang") || "th"; } catch (e) {}
const urlLang = new URLSearchParams(location.search).get("lang");
if (urlLang === "en" || urlLang === "th") lang = urlLang;
render(lang);
</script>
</body>
